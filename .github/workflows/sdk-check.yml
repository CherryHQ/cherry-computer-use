name: sdk-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/sdk/**"
      - "packages/sdk-native/**"
      - "packages/cli/**"
      - ".changeset/**"
      - "scripts/npm/**"
      - "scripts/*release*.sh"
      - "assets/app-icons/**"
      - "plugins/**"
      - ".github/workflows/release.yml"
      - "protocol/**"
      - "packages/runtime-go/**"
      - "packages/OpenComputerUseKit/**"
      - "apps/OpenComputerUse/**"
      - "apps/OpenComputerUseWindows/**"
      - "apps/OpenComputerUseLinux/**"
      - "experiments/LinuxNativeProbe/**"
      - "scripts/build-open-computer-use-*.sh"
      - "Package.swift"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sdk-check.yml"
  push:
    branches: [main]
    paths:
      - "packages/sdk/**"
      - "packages/sdk-native/**"
      - "packages/cli/**"
      - ".changeset/**"
      - "scripts/npm/**"
      - "scripts/*release*.sh"
      - "assets/app-icons/**"
      - "plugins/**"
      - ".github/workflows/release.yml"
      - "protocol/**"
      - "packages/runtime-go/**"
      - "packages/OpenComputerUseKit/**"
      - "apps/OpenComputerUse/**"
      - "apps/OpenComputerUseWindows/**"
      - "apps/OpenComputerUseLinux/**"
      - "experiments/LinuxNativeProbe/**"
      - "scripts/build-open-computer-use-*.sh"
      - "Package.swift"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sdk-check.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: SDK and native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.23.4"
          cache-dependency-path: |
            apps/OpenComputerUseWindows/go.sum
            apps/OpenComputerUseLinux/go.sum
            experiments/LinuxNativeProbe/go.sum
      - run: npm ci --ignore-scripts
      - run: npm run release:versions:check && npm run release:check
      - name: Build SDK once for native and client tests
        id: sdk-build
        run: npm run sdk:build
      - name: Check SDK types
        run: npm run sdk:check
      - if: runner.os == 'Windows'
        run: go test ./...
        working-directory: packages/runtime-go
      - if: runner.os != 'Windows'
        run: go test -race ./...
        working-directory: packages/runtime-go
      - if: runner.os == 'macOS'
        run: |
          swift test --filter 'SDKSessionTests|PermissionOnboardingTests'
          OPEN_COMPUTER_USE_CODESIGN_MODE=adhoc ./scripts/build-open-computer-use-app.sh debug
      - if: runner.os == 'Linux'
        working-directory: apps/OpenComputerUseLinux
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "gofmt needed: $unformatted"; exit 1; }
          go vet ./...
          go test ./...
          go build -o ../../dist/native/open-computer-use .
      - if: runner.os == 'Linux'
        name: Linux Wayland helper (Rust)
        working-directory: apps/OpenComputerUseLinux/wayland-helper
        run: |
          cargo --version
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          node ../../../scripts/wayland-helper-notices.mjs --check
          cargo test --locked
          cargo build --locked --release
          ls -l target/release/open-computer-use-wayland
      - if: runner.os == 'Linux'
        name: Linux X11 engine, global input and SDK actions (isolated Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb at-spi2-core dbus python3-gi gir1.2-gtk-3.0
          session=apps/OpenComputerUseLinux/testdata/x11-session.sh
          (cd apps/OpenComputerUseLinux && OPEN_COMPUTER_USE_LINUX_DESKTOP_TEST=1 testdata/x11-session.sh go test -count=1 -run 'X11|Guard|RealDesktop' -v ./internal/...)
          $session sh -c '
            python3 apps/OpenComputerUseLinux/testdata/gtk_fixture.py "CI Fixture" & fixture=$!
            sleep 2
            export COMPUTER_USE_RUNTIME_PATH="$PWD/dist/native/open-computer-use" COMPUTER_USE_FIXTURE_APP=cherry-linux-fixture COMPUTER_USE_REQUIRE_SCREENSHOT=1
            node --test protocol/desktop.test.mjs; code=$?
            kill $fixture; exit $code'
          $session sh -c '
            python3 apps/OpenComputerUseLinux/testdata/gtk_fixture.py "CI Actions" & fixture=$!
            sleep 2
            export COMPUTER_USE_RUNTIME_PATH="$PWD/dist/native/open-computer-use" COMPUTER_USE_LINUX_ACTION_FIXTURE=cherry-linux-fixture
            node --test protocol/linux-desktop.test.mjs; code=$?
            kill $fixture; exit $code'
          $session sh apps/OpenComputerUseLinux/testdata/app-launch-session.sh
      - if: runner.os == 'Windows'
        working-directory: apps/OpenComputerUseWindows
        run: |
          COMPUTER_USE_WINDOWS_LAUNCH_TEST=1 go test -run SDKColdLaunchExecutable -count=1 .
          go test ./...
          go build -o ../../dist/native/open-computer-use.exe .
      - if: runner.os == 'Linux'
        name: Linux wlroots input and capture (isolated headless Sway)
        run: |
          sudo apt-get install -y --no-install-recommends sway xwayland
          sway --version
          cp apps/OpenComputerUseLinux/wayland-helper/target/release/open-computer-use-wayland dist/native/
          export OPEN_COMPUTER_USE_WAYLAND_HELPER="$PWD/dist/native/open-computer-use-wayland"
          session="$PWD/apps/OpenComputerUseLinux/testdata/wlroots-session.sh"
          (cd apps/OpenComputerUseLinux && "$session" sway go test -count=1 -run Wlroots -v ./internal/desktop/)
          (cd apps/OpenComputerUseLinux && OCU_XWAYLAND=1 "$session" sway go test -count=1 -run 'Wlroots|XWayland' -v ./internal/desktop/)
          "$session" sway sh -c '
            python3 apps/OpenComputerUseLinux/testdata/gtk_fixture.py "CI Sway" & fixture=$!
            for _ in $(seq 100); do dist/native/open-computer-use list-apps 2>/dev/null | grep -q cherry-linux-fixture && break; sleep 0.2; done
            export COMPUTER_USE_RUNTIME_PATH="$PWD/dist/native/open-computer-use" COMPUTER_USE_LINUX_ACTION_FIXTURE=cherry-linux-fixture
            node --test protocol/linux-desktop.test.mjs; code=$?
            kill $fixture; exit $code'
      - run: node --test protocol/native.test.mjs
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'CherrySDKFixture.exe'
          & ./protocol/fixtures/windows.ps1 -OutputPath $fixture
          $process = Start-Process $fixture -PassThru
          try {
            $env:COMPUTER_USE_RUNTIME_PATH = Join-Path $PWD 'dist/native/open-computer-use.exe'
            $env:COMPUTER_USE_FIXTURE_APP = 'CherrySDKFixture'
            $env:COMPUTER_USE_REQUIRE_SCREENSHOT = '1'
            node --test protocol/desktop.test.mjs
            $code = $LASTEXITCODE
          } finally { Stop-Process -Id $process.Id -ErrorAction SilentlyContinue }
          exit $code
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP 'CherrySDKActions.exe'
          & ./protocol/fixtures/windows-actions.ps1 -OutputPath $fixture
          $process = Start-Process $fixture -PassThru
          try {
            $env:COMPUTER_USE_RUNTIME_PATH = Join-Path $PWD 'dist/native/open-computer-use.exe'
            $env:COMPUTER_USE_WINDOWS_ACTION_FIXTURE = 'CherrySDKActions'
            node --test protocol/windows-desktop.test.mjs
            $code = $LASTEXITCODE
          } finally { Stop-Process -Id $process.Id -ErrorAction SilentlyContinue }
          exit $code
      - if: runner.os == 'Linux'
        run: |
          ./scripts/build-open-computer-use-linux.sh --arch amd64
          (cd experiments/LinuxNativeProbe && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o ../../dist/linux/amd64/native-probe .)
          docker build -t cherry-native-probe experiments/LinuxNativeProbe
          docker run --rm -e PROBE_ARCH=amd64 -v "$PWD:/workspace:ro" -w /workspace cherry-native-probe
      - name: Test SDK client and package consumers
        if: ${{ !cancelled() && steps.sdk-build.outcome == 'success' }}
        run: npm run test:built --workspace @cherrystudio/computer-use

  # GNOME 46 on ubuntu-24.04 focuses a headless fixture without GTK ever reporting
  # it active, so the GNOME portal keyboard runs on a GNOME 50 image instead.
  linux-gnome:
    name: Linux GNOME Wayland (headless GNOME, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # GNOME 50 and 46, the newest and oldest Shell versions the extension supports.
        os: [ubuntu-26.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.23.4"
          cache-dependency-path: apps/OpenComputerUseLinux/go.sum
      - run: npm ci --ignore-scripts
      - run: npm run sdk:build
      - name: Build the Linux runtime and Wayland helper
        run: |
          mkdir -p dist/native
          (cd apps/OpenComputerUseLinux && go build -o ../../dist/native/open-computer-use .)
          (cd apps/OpenComputerUseLinux/wayland-helper && cargo --version && cargo build --locked --release)
          cp apps/OpenComputerUseLinux/wayland-helper/target/release/open-computer-use-wayland dist/native/
      - name: Install headless GNOME
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell libglib2.0-bin at-spi2-core dbus python3-gi gir1.2-gtk-3.0 wayland-utils xwayland
          gnome-shell --version
      - name: Portal keyboard without the Shell extension
        run: |
          export OPEN_COMPUTER_USE_WAYLAND_HELPER="$PWD/dist/native/open-computer-use-wayland"
          session="$PWD/apps/OpenComputerUseLinux/testdata/gnome-session.sh"
          (cd apps/OpenComputerUseLinux && "$session" go test -count=1 -run GNOME -v ./internal/desktop/)
          "$session" sh -c "$SDK_TEST"
      - name: Capture and input through the Shell extension
        run: |
          # The runtime's own install-gnome-extension installs it before the shell starts.
          export OPEN_COMPUTER_USE_WAYLAND_HELPER="$PWD/dist/native/open-computer-use-wayland" OCU_GNOME_SHELL_EXTENSION="$PWD/dist/native/open-computer-use"
          session="$PWD/apps/OpenComputerUseLinux/testdata/gnome-session.sh"
          (cd apps/OpenComputerUseLinux && "$session" go test -count=1 -run GNOMEShell -v ./internal/desktop/)
          "$session" sh -c "$SDK_TEST"
      - name: XWayland windows through the Shell extension
        run: |
          export OPEN_COMPUTER_USE_WAYLAND_HELPER="$PWD/dist/native/open-computer-use-wayland" OCU_GNOME_SHELL_EXTENSION="$PWD/dist/native/open-computer-use" OCU_XWAYLAND=1
          session="$PWD/apps/OpenComputerUseLinux/testdata/gnome-session.sh"
          (cd apps/OpenComputerUseLinux && "$session" go test -count=1 -run 'GNOMEShell|XWayland' -v ./internal/desktop/)
    env:
      SDK_TEST: |
        python3 apps/OpenComputerUseLinux/testdata/gtk_fixture.py "CI Wayland" & fixture=$!
        for _ in $(seq 100); do dist/native/open-computer-use list-apps 2>/dev/null | grep -q cherry-linux-fixture && break; sleep 0.2; done
        export COMPUTER_USE_RUNTIME_PATH="$PWD/dist/native/open-computer-use" COMPUTER_USE_LINUX_ACTION_FIXTURE=cherry-linux-fixture
        node --test protocol/linux-desktop.test.mjs; code=$?
        kill $fixture; exit $code

  linux-hyprland:
    name: Linux Hyprland (nested in headless labwc, ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.23.4"
          cache-dependency-path: apps/OpenComputerUseLinux/go.sum
      - run: npm ci --ignore-scripts
      - run: npm run sdk:build
      - name: Build the Linux runtime and Wayland helper
        run: |
          mkdir -p dist/native
          (cd apps/OpenComputerUseLinux && go build -o ../../dist/native/open-computer-use .)
          (cd apps/OpenComputerUseLinux/wayland-helper && cargo --version && cargo build --locked --release)
          cp apps/OpenComputerUseLinux/wayland-helper/target/release/open-computer-use-wayland dist/native/
      - name: Install Hyprland and labwc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hyprland labwc xwayland mesa-libgallium libgl1-mesa-dri libgbm1 libegl-mesa0 at-spi2-core dbus python3-gi gir1.2-gtk-3.0
          Hyprland --version | head -1
          labwc --version
      - name: Give the compositors a DRM device
        # Hyprland has no headless mode, so it runs nested in a headless labwc,
        # and both render through a DRM device. The runner has no GPU; vgem gives
        # Mesa's software renderer one.
        run: |
          before=$(ls /dev/dri 2>/dev/null || true)
          sudo modprobe vgem || { sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" && sudo modprobe vgem; }
          ls /dev/dri | grep -vxF "$before" > "$RUNNER_TEMP/vgem"
          echo "before: $before; vgem: $(cat "$RUNNER_TEMP/vgem" | tr '\n' ' ')"
          # udev sets the new nodes' owner and mode after modprobe returns; wait
          # for it, or it undoes the chmod.
          sudo udevadm settle
          sudo chmod a+rw /dev/dri/*
          # Mesa's software renderer allocates dumb buffers, which vgem allows only
          # on its primary node; Hyprland opens the render node, so it gets the
          # primary node there.
          card=$(grep -x 'card[0-9]*' "$RUNNER_TEMP/vgem")
          render=$(grep -x 'renderD[0-9]*' "$RUNNER_TEMP/vgem")
          sudo mount --bind "/dev/dri/$card" "/dev/dri/$render"
          ls -l /dev/dri
      - name: Capture and input through Hyprland
        run: |
          export OPEN_COMPUTER_USE_WAYLAND_HELPER="$PWD/dist/native/open-computer-use-wayland" OCU_WLROOTS_DEBUG=1
          ls -l /dev/dri
          session="$PWD/apps/OpenComputerUseLinux/testdata/wlroots-session.sh"
          (cd apps/OpenComputerUseLinux && "$session" hyprland go test -count=1 -run Wlroots -v ./internal/desktop/)
          (cd apps/OpenComputerUseLinux && OCU_XWAYLAND=1 "$session" hyprland go test -count=1 -run 'Wlroots|XWayland' -v ./internal/desktop/)
          "$session" hyprland sh -c '
            python3 apps/OpenComputerUseLinux/testdata/gtk_fixture.py "CI Hyprland" & fixture=$!
            for _ in $(seq 100); do dist/native/open-computer-use list-apps 2>/dev/null | grep -q cherry-linux-fixture && break; sleep 0.2; done
            export COMPUTER_USE_RUNTIME_PATH="$PWD/dist/native/open-computer-use" COMPUTER_USE_LINUX_ACTION_FIXTURE=cherry-linux-fixture
            node --test protocol/linux-desktop.test.mjs; code=$?
            kill $fixture; exit $code'

  linux-kde:
    name: Linux KDE Plasma (isolated KWin, ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.23.4"
          cache-dependency-path: apps/OpenComputerUseLinux/go.sum
      - run: npm ci --ignore-scripts
      - run: npm run sdk:build
      - name: Build the Linux runtime and Wayland helper
        run: |
          mkdir -p dist/native
          (cd apps/OpenComputerUseLinux && go build -o ../../dist/native/open-computer-use .)
          (cd apps/OpenComputerUseLinux/wayland-helper && cargo --version && cargo build --locked --release)
          cp apps/OpenComputerUseLinux/wayland-helper/target/release/open-computer-use-wayland dist/native/
      - name: Install KWin
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kwin-wayland kwin-common xwayland mesa-libgallium libgl1-mesa-dri libgbm1 libkf6service-bin libglib2.0-bin at-spi2-core dbus python3-gi gir1.2-gtk-3.0
          kwin_wayland --version
      - name: Give KWin a DRM device
        # KWin's virtual backend composites with OpenGL only on a DRM device, and
        # captures windows only with OpenGL. The runner has no GPU; vgem, as in
        # KWin's own CI, gives Mesa's software renderer a device. With CI set,
        # KWin opens /dev/dri/card1, which on the runner is a Hyper-V display
        # that cannot render, so vgem's node is mounted over it.
        run: |
          before=$(ls /dev/dri 2>/dev/null || true)
          sudo modprobe vgem || { sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" && sudo modprobe vgem; }
          vgem=$(ls /dev/dri | grep -x 'card[0-9]*' | grep -vxF "$before" || true)
          echo "before: $before; vgem: $vgem"
          [ -n "$vgem" ]
          [ "$vgem" = card1 ] || { sudo touch /dev/dri/card1; sudo mount --bind "/dev/dri/$vgem" /dev/dri/card1; }
          # udev sets the new nodes' owner and mode after modprobe returns; wait
          # for it, or it undoes the chmod.
          sudo udevadm settle
          sudo chmod a+rw /dev/dri/*
          ls -l /dev/dri
      - name: Capture and input through KWin
        run: |
          # The runtime's own install-kde-integration authorizes the helper once KWin is up.
          export OPEN_COMPUTER_USE_WAYLAND_HELPER="$PWD/dist/native/open-computer-use-wayland" OCU_KDE_INTEGRATION="$PWD/dist/native/open-computer-use" OCU_KWIN_DEBUG=1
          session="$PWD/apps/OpenComputerUseLinux/testdata/kwin-session.sh"
          (cd apps/OpenComputerUseLinux && "$session" go test -count=1 -run KDE -v ./internal/desktop/)
          # XWayland windows; XTEST in a session of its own, since KWin's drag
          # proxy window stays on the X root after the KDE test's drag.
          (cd apps/OpenComputerUseLinux && OCU_XWAYLAND=1 "$session" go test -count=1 -run KDE -v ./internal/desktop/)
          (cd apps/OpenComputerUseLinux && OCU_XWAYLAND=1 "$session" go test -count=1 -run XWayland -v ./internal/desktop/)
          "$session" sh -c '
            python3 apps/OpenComputerUseLinux/testdata/gtk_fixture.py "CI KDE" & fixture=$!
            for _ in $(seq 100); do dist/native/open-computer-use list-apps 2>/dev/null | grep -q cherry-linux-fixture && break; sleep 0.2; done
            export COMPUTER_USE_RUNTIME_PATH="$PWD/dist/native/open-computer-use" COMPUTER_USE_LINUX_ACTION_FIXTURE=cherry-linux-fixture
            node --test protocol/linux-desktop.test.mjs; code=$?
            kill $fixture; exit $code'
