[package]
name = "open-computer-use-wayland"
version = "0.0.0"
edition = "2024"
publish = false
description = "Wayland display helper for the Linux open-computer-use runtime"

[[bin]]
name = "open-computer-use-wayland"
path = "src/main.rs"

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
base64 = "0.23.1"
bitflags = "2"
libc = "0.2.190"
reis = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "time"] }
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-scanner = "0.31"
xkbcommon-dl = "0.4.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
