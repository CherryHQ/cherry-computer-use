[package]
name = "linux-wayland-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
reis = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
futures-util = "0.3"
